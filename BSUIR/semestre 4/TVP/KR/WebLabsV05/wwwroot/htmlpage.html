    <link href="css/site.css" rel="stylesheet" />
</head>
<body>

                    00,0 руб.(0)

                </a>

                <div class="dropdown ml-4 nav-color">
                    <div class="dropdown-toggle" id="dropdownMenuButton" data-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
                        <img src="images/avatar.jpg" width="30" alt="User" class="rounded" />
                    </div>
                    <div class="dropdown-menu" aria-labelledby="dropdownMenuButton">

                <!-- Информация пользователя - конец -->

    <main class="container">
        <h1>Лабораторная работа 1</h1>
        <h2>Список</h2>
        <ol type="A">
            <li>элемент 1 списка</li>
            <li>элемент 2 списка</li>
        </ol>
        <hr />
        <h2>Форма</h2>
        <form role="form" method="post">
            <fieldset class="form-group">
                <div class="row">
                    <div class="col-sm-2"></div>
                    <div class="col-sm-10">
                        <div class="form-check">
                            <input type="checkbox" class="form-check-input" name="chk1" id="check1" />
                            <label for="check1" class="form-check-label"> Чек-бокс 1</label>
                        </div>
                        <div class="form-check">
                            <input type="checkbox" class="form-check-input" name="chk2" id="check2" />
                            <label for="check2" class="form-check-label"> Чек-бокс 2</label>
                        </div>
                    </div>
                </div>
            </fieldset>

            <div class="form-group row">
                <div class="col-sm-2"></div>
                <div class="col-sm-8">
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" checked="checked" name="radio" value="1" id="radio1" />
                        <label class="form-check-label" for="radio1">Радио-1</label>
                    </div>
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" name="radio" value="2" id="radio1" />
                        <label class="form-check-label" for="radio2">Радио-2</label>
                    </div>
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" name="radio" value="3" id="radio3" />
                        <label class="form-check-label" for="radio3">Радио-3</label>
                    </div>
                </div>
            </div>

            <div class="form-group row">
                <label for="login" class="col-sm-2 col-form-label">Логин:</label>
                <div class="col-md-10">
                    <input type="text" id="login" name="pass" class="form-control" placeholder="Введите имя" />
                </div>
            </div>
            <div class="form-group row">
                <label for="pass" class="col-sm-2 col-form-label">Пароль:</label>
                <div class="col-md-10">
                    <input type="password" id="pass" name="pass" class="form-control" placeholder="Введите пароль" />
                </div>
            </div>
            <div class="form-group row">
                <div class="col-sm-8">
                    <button type="submit" class="btn btn-info">Отправить</button>
                </div>
            </div>
        </form>
    </main>
    <footer>
        <div class="container">

                    <a class="nav-item nav-link" href="twitter.com"><i class="fa fa-twitter fa-2x"></i></a>
                </div>
            </div>
        </div>
    </footer>
    <script src="lib/jquery/dist/jquery.js"></script>
    <script src="lib/bootstrap/dist/js/bootstrap.js"></script>
</body>
</html>
