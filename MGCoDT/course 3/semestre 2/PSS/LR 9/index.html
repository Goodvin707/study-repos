<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ЛР 9</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <table border="1" cellpadding="3">
        <tr>
            <td class="cl1" onmouseover="this.className = 'cl2'" onmouseout="this.className ='cl1'">Элемент 1</td>
            <td class="cl1" ondblclick="this.className = 'cl3'"onmouseout="this.className ='cl1'">Элемент 2</td>
            <td class="cl1" onclick="this.className = 'cl4'" onmouseout="this.className ='cl1'">Элемент 3</td>
            <td class="cl1" onmouseover="this.style.color = 'yellow'" onmouseout="this.style.color = 'blue'">Элемент 4</td>
            <td class="cl1" ondblclick="this.style.backgroundColor = 'red'" onmouseout="this.style.backgroundColor = ''">Элемент 5</td>
            <td class="cl1" onclick="this.style = 'font-style: italic'" onmouseout="this.style = 'font-style: normal'">Элемент 6</td>
        </tr>
    </table>
</body>
</html>
