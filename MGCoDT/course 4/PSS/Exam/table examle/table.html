<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Оценки по информатике и математике учеников 7 класса</title>
        <style>
            table.myStyle {
                text-decoration: none;
                border-collapse: collapse;
                width: auto;
                text-align: center;
            }
            table.myStyle th {
                font-weight: 500;
                font-size: 22px;
                color: #ffffff;
                background-color: #354251;
            }
            table.myStyle td {
                font-size: 21px;
                color: #354251;
            }
            table.myStyle td,
            table.myStyle th {
                white-space: pre-wrap;
                padding: 18px 17px;
                line-height: 21px;
                vertical-align: middle;
                border: 1px solid #897691;
            }
            table.myStyle tr:hover:nth-child(even) {
                background-color: #353b40;
            }
            table.myStyle tr:hover:nth-child(even) td {
                color: #2d96e0;
            }
        </style>
    </head>
    <body>
        <table class="myStyle">
            <tbody>
                <tr>
                    <th rowspan="3">Ученик</th>
                    <th colspan="6">Период обучения</th>
                </tr>
                <tr>
                    <th colspan="2">I четверть</th>
                    <th colspan="2">II четверть</th>
                    <th colspan="2">1-е полугодие</th>
                </tr>
                <tr>
                    <th>Информатика</th>
                    <th>Математика</th>
                    <th>Информатика</th>
                    <th>Математика</th>
                    <th>Информатика</th>
                    <th>Математика</th>
                </tr>
                <tr>
                    <td>Иванов Дима</td>
                    <td>4</td>
                    <td>4</td>
                    <td>5</td>
                    <td>5</td>
                    <td>5</td>
                    <td>3</td>
                </tr>
                <tr>
                    <td>Петров Михаил</td>
                    <td>4</td>
                    <td>3</td>
                    <td>5</td>
                    <td>4</td>
                    <td>3</td>
                    <td>5</td>
                </tr>
                <tr>
                    <td>Голубев Петр</td>
                    <td>5</td>
                    <td>5</td>
                    <td>5</td>
                    <td>4</td>
                    <td>4</td>
                    <td>5</td>
                </tr>
                <tr>
                    <td>Гордеев Иван</td>
                    <td>4</td>
                    <td>5</td>
                    <td>3</td>
                    <td>5</td>
                    <td>4</td>
                    <td>5</td>
                </tr>
                <tr>
                    <th colspan="5">Итого (средняя оценка)</th>
                    <th>4</th>
                    <th>4,5</th>
                </tr>
            </tbody>
        </table>
    </body>
</html>
