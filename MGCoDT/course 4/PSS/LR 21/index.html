<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width`, initial-scale=1.0">
    <title>Validation</title>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.3.1/jquery.min.js"></script>
    <script src="jquery.maskedinput.min.js"></script>
    <script>
        $(function () {
            $("#phone").mask("+375(99) 999-99-99");
        });
    </script>
    <script>
        const validateEmail = (email) => {
            return email.match(
                /^(([^<>()[\]\\.,;:\s@\"]+(\.[^<>()[\]\\.,;:\s@\"]+)*)|(\".+\"))@((\[[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\])|(([a-zA-Z\-0-9]+\.)+[a-zA-Z]{2,}))$/
            );
        };

        const validate = () => {
            const $result = $('#result');
            const email = $('#email').val();
            $result.text('');

            if (validateEmail(email)) {
                $result.text(email + ' is valid :)');
                $result.css('color', 'green');
            } else {
                $result.text(email + ' is not valid :(');
                $result.css('color', 'red');
            }
            return false;
        }

        $('#email').on('#submit', validate);
    </script>
</head>

<body>
    <form name="form" method="post" id="form_message">
        <h2>Форма обратной связи.</h2>
        <p>
        <div class="titles">Ваше ФИО</div> <input id="#fio" class="input" name="name" type="text" pattern="[a-zA-Z]{3,30}\s[a-zA-Z]{3,30}" style="text-transform: uppercase" /> </p>
        <p>
        <div class="titles">Электронная почта</div> <input class="input" name="email" type="text" /> </p>

        <p>
        <div class="titles">Номер телефона</div> <input class="input" id="phone" name="subjects" type="text" /> </p>
        <p>
        <div class="titles">Дата рождения</div> <input class="input" name="subjects" type="date" /> </p>
        <p>
        <div class="titles">Текст сообщения:</div><textarea name="message" cols="22" rows="5" minlength="10" maxlength="300" /></textarea></p>
        <p><input id="submit" value="Отправить" type="submit" /></p>
    </form>
</body>

</html>
