<!DOCTYPE html>
<html lang="ru">
    <head>
        <meta charset="UTF-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Форма отправки резюме</title>
    </head>
    <style>
        body {
            margin: 50px;
        }
        .myStyle {
            width: 200px;
            padding: 20px;
        }
        input {
            padding: 10px;
            margin: 10px 0;
            border: 2px solid rgb(155, 130, 212);
            border-radius: 10px;
            box-shadow: 0 0 15px 4px rgba(19, 1, 1, 0.06);
            transition: 5.3s border-color;
        }
        input:hover {
            border: 1px solid #aaa;
        }
        input,
        textarea {
            font-family: inherit;
            font-size: inherit;
        }
        button.submitbtn {
            appearance: none;
            -webkit-appearance: none;
            padding: 10px;
            border: none;
            background-color: #3f51b5;
            color: #fff;
            font-weight: 600;
            border-radius: 5px;
            width: 100%;
            -webkit-transition: All 0.5s ease;
            -moz-transition: All 0.5s ease;
            -o-transition: All 0.5s ease;
            -ms-transition: All 0.5s ease;
            transition: All 0.5s ease;
        }
        button.submitbtn:hover {
            background-color: #68ee0e;
        }
        button.resetbtn {
            appearance: none;
            -webkit-appearance: none;
            padding: 10px;
            border: none;
            background-color: #3f51b5;
            color: #fff;
            font-weight: 600;
            border-radius: 5px;
            width: 100%;
            -webkit-transition: All 0.5s ease;
            -moz-transition: All 0.5s ease;
            -o-transition: All 0.5s ease;
            -ms-transition: All 0.5s ease;
            transition: All 0.5s ease;
        }
        button.resetbtn:hover {
            background-color: #e94117;
        }
    </style>
    <body>
        <div class="myStyle">
            <div class="">
                <h1>Резюме</h1>
            </div>
            <div class="">
                <h3>Общая информация</h3>
            </div>
            <div>
                <label>Фамилия<span>*</span></label>
                <input type="text" />
            </div>
            <div>
                <label>Имя<span>*</span></label>
                <input type="text" />
            </div>
            <div>
                <label>Отчество</label>
                <input type="text" />
            </div>
            <div>
                <label>Дата рождения<span>*</span></label>
                <input type="date" />
            </div>
            <p></p>
            <div>
                <label>Пол<span>*</span></label>
                <select>
                    <option>Мужской</option>
                    <option>Женский</option>
                </select>
            </div>
            <p></p>
            <div>
                <label>Фото</label>
                <input type="file" />
            </div>
            <div>
                <h3>Контактная информация</h3>
            </div>
            <div>
                <label>Телефон<span>*</span></label>
                <input type="tel" />
            </div>
            <div>
                <label>Электронная почта<span>*</span></label>
                <input type="email" />
            </div>
            <div>
                <label>Адрес проживания<span>*</span></label>
                <input type="text" />
            </div>
            <div>
                <label>Город проживания<span>*</span></label>
                <select>
                    <option>Минск</option>
                    <option>Брест</option>
                    <option>Гродно</option>
                    <option>Гомель</option>
                    <option>Могилев</option>
                    <option>Витебск</option>
                </select>
            </div>
            <div>
                <h3>Образование</h3>
            </div>
            <div>
                <label>Высшее</label>
                <input type="text" />
            </div>
            <div>
                <label>Среднее</label>
                <input type="text" />
            </div>
            <div>
                <label>Дополнительное</label>
                <input type="text" />
            </div>
            <div>
                <label>Курсы</label>
                <input type="text" />
            </div>
            <div>
                <h3>Карьера</h3>
            </div>
            <div>
                <label>Место работы 1</label>
                <input type="text" />
            </div>
            <div>
                <label>Дата начала работы</label>
                <input type="date" />
            </div>
            <div>
                <label>Дата окончания работы</label>
                <input type="date" />
            </div>
            <div>
                <label>Место работы 2</label>
                <input type="text" />
            </div>
            <div>
                <label>Дата начала работы</label>
                <input type="date" />
            </div>
            <div>
                <label>Дата окончания работы</label>
                <input type="date" />
            </div>
            <div>
                <label>Место работы 3</label>
                <input type="text" />
            </div>
            <div>
                <label>Дата начала работы</label>
                <input type="date" />
            </div>
            <div>
                <label>Дата окончания работы</label>
                <input type="date" />
            </div>
            <div>
                <h3>О себе</h3>
            </div>
            <div>
                <textarea
                    type="textarea"
                    style="margin: 0px; width: 480px; height: 250px"
                ></textarea>
            </div>
            <div>
                <button type="submit" class="submitbtn">Отправить</button>
            </div>
            <p></p>
            <div>
                <button type="reset" class="resetbtn">Очистить</button>
            </div>
        </div>
    </body>
</html>
