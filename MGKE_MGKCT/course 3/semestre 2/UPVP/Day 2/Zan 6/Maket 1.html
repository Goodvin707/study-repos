<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
.fdiv {
    display: inline-flex;
    height: 25vw
}

.fvdiv {
    display: inline-flex;
    flex-direction: column;
}

.div {
    text-align: center;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-content: center;
    margin: 18px;
}

.headerflex {
    display: flex;
    flex-direction: row;
    margin-top: 18px;
}

.hb {
    display: flex;
    flex-direction: column;
    text-align: left;
    justify-content: center;
    border: thin solid;
    height: 90px;
    margin-inline: 12px;
}
.mb {
    display: flex;
    flex-direction: column;
    text-align: left;
    justify-content: center;
    border: thin solid;
    height: 90px;
    margin: 12px;
}
.cb {
    display: flex;
    flex-direction: column;
    text-align: left;
    justify-content: center;
    border: thin solid;
    height: 74px;
    margin: 12px;
}

.contentflex {
    display: flex;
    flex-direction: row;
    border: thin solid;
    width: 100%;
    height: 100%;
}

.cvflex {
    display: flex;
    flex-direction: column;
    width: 60%;
}

.civflex {
    width: 95%;
    height: 45%;
    border: thin solid;
    margin: 12px;
}

.footerflex {
    display: flex;
    flex-direction: row;
    border: thin solid;
    height: 50%;
    margin-top: 16px;
}

.fb {
    display: flex;
    flex-direction: column;
    text-align: left;
    justify-content: center;
    border: thin solid;
    height: 90%;
    margin: 6px;
}
    </style>
</head>
<body style="border: 1px solid black;">
    <div class="fvdiv">
        <div class="div" style="height: 10vw;">
            Шапка сайта
            <div class="headerflex">
                <div class="hb" style="width: 40%; padding-left: 10px;" >лого</div>
                <div class="hb" style="width: 65%; text-align: center; margin-left: 3%;">Название сайта</div>
            </div>
        </div>
        <div class="fdiv" style="margin-left: 1%;">
            <div class="div" style="width: 30vw;">Меню
                <div style="border: thin solid">
                    <div style="padding-left: 10px;" class="mb">Страница 1</div>
                    <div style="padding-left: 10px;" class="mb">Страница 2</div>
                    <div style="padding-left: 10px;" class="mb">Страница 3</div>
                </div>
            </div>
            <div class="div" style="width: 40vw;">Контент
                <div style="border: thin solid">
                    <div style="padding-left: 10px;" class="cb"></div>
                    <div style="padding-left: 10px;" class="cb"></div>
                    <div style="padding-left: 10px; height: 120px;" class="cb"></div>
                </div>
            </div>
            <div class="div" style="width: 20vw; height: 85%; margin-top: 30px;">Новости
                <div style="border: thin solid; height: 100%;">
                </div>
            </div>
        </div>
        <div class="div" style="height: 10vw;">Подвал сайта
            <div class="footerflex" style="padding-bottom: 30px; margin-left: 1%;">
                <div class="fb" style="width: 35%; margin-right: 27%; padding-left: 10px;">картинка</div>
                <div class="fb" style="width: 35%; margin-right: 27%; padding-left: 10px;">контакты</div>
                <div class="fb" style="width: 35%; padding-left: 10px;">разработчик</div>
            </div>
        </div>
    </div>
</body>
</html>
