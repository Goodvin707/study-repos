<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
.fdiv {
    display: inline-flex;
    height: 25vw
}

.fvdiv {
    display: inline-flex;
    flex-direction: column;
}

.div {
    text-align: center;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-content: center;
    margin: 12px;
}

.headerflex {
    display: flex;
    flex-direction: row;
    margin-top: 16px;
}

.hb {
    display: flex;
    flex-direction: column;
    text-align: left;
    justify-content: center;
    border: thin solid;
    height: 90px;
    margin-inline: 12px;
}

.mb {
    display: flex;
    flex-direction: column;
    text-align: left;
    justify-content: center;
    border: thin solid;
    height: 90px;
    margin: 12px;
}

.contentflex {
    display: flex;
    flex-direction: column;
    border: thin solid;
    width: 100%;
    height: 100%;
}

.cvflex {
    display: flex;
    flex-direction: row;
    width: 100%;
    height: 100%;
}

.footerflex {
    display: flex;
    flex-direction: row;
    border: thin solid;
    height: 100%;
    margin-top: 16px;
}

.fb {
    display: flex;
    flex-direction: column;
    text-align: left;
    justify-content: center;
    border: thin solid;
    height: 90%;
    margin: 6px;
}
    </style>
</head>
<body>
    <div class="fvdiv">
        <div class="div" style="height: 10vw;">
            Шапка сайта
            <div class="headerflex">
                <div class="hb" style="width: 35%">лого</div>
                <div class="hb" style="width: 65%; text-align: center;">Название сайта</div>
            </div>
        </div>
        <div class="fdiv">
            <div class="div" style="width: 75vw;">Контент
                <div class="contentflex">
                    <div style="border: thin solid; height: 15%; width: 97%; margin: 12px;"></div>
                    <div class="cvflex">
                        <div style="width: 60%; height: 90%; border: thin solid; margin: 12px;"></div>
                        <div style="width: 40%; height: 90%; border: thin solid; margin: 12px;"></div>
                    </div>
                </div>
            </div>
            <div class="div" style="width: 20vw;">Меню
                <div style="border: thin solid">
                    <div class="mb">Страница 1</div>
                    <div class="mb">Страница 2</div>
                    <div class="mb">Страница 3</div>
                </div>
            </div>
        </div>
        <div class="div" style="height: 10vw;">Подвал сайта
            <div class="footerflex">
                <div class="fb" style="width: 35%; margin-right: 27%;">разработчик</div>
                <div class="fb" style="width: 35%;">картинка</div>
            </div>
        </div>
</body>
</html>
