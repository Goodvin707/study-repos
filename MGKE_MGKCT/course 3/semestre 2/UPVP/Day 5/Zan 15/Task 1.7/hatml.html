<!DOCTYPE html>
<html lang="en">
     <head>
          <meta charset="UTF-8" />
          <meta name="viewport" content="width=device-width, initial-scale=1.0" />
          <title>Задача 7</title>
          <link rel="stylesheet" type="text/css" href="style.css" />
     </head>
     <body>
          <div class="slider">
               <div class="item">
                    <img src="images/img1.png" alt="Первый слайд" />
                    <div class="slideText">Заголовок слайда 1</div>
               </div>

               <div class="item">
                    <img src="images/img2.png" alt="Второй слайд" />
                    <div class="slideText">Заголовок слайда 2</div>
               </div>

               <div class="item">
                    <img src="images/img3.png" alt="Третий слайд" />
                    <div class="slideText">Заголовок слайда 3</div>
               </div>

               <a class="prev" onclick="minusSlide()">&#10094;</a>
               <a class="next" onclick="plusSlide()">&#10095;</a>
          </div>
          <div class="slider-dots">
               <span class="slider-dots_item" onclick="currentSlide(1)"></span>
               <span class="slider-dots_item" onclick="currentSlide(2)"></span>
               <span class="slider-dots_item" onclick="currentSlide(3)"></span>
          </div>
          <script src="script.js"></script>
     </body>
</html>
