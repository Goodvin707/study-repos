     <script type="text/javascript">
          $("#hide").click(function () {
               $("#elem").hide();
          });
          $("#show").click(function () {
               $("#elem").show();
          });
          $("#fade-to-zero").click(function () {
               $("#elem").fadeTo(200, 0.2, "linear");
          });
          $("#fade-to-one").click(function () {
               $("#elem").fadeTo(200, 1, "linear");
          });
