<!DOCTYPE html>
<html lang="en">
     <head>
          <meta charset="UTF-8" />
          <meta http-equiv="X-UA-Compatible" content="IE=edge" />
          <meta name="viewport" content="width=device-width, initial-scale=1.0" />
          <title>Задание 2</title>
          <style type="text/css">
               #square {
                    position: absolute;
                    top: 4px;
                    left: 4px;
                    height: 80px;
                    width: 80px;
                    background-color: red;
                    border-style: solid;
                    border-width: 1px;
               }
          </style>
          <script src="..\..\jquery-3.6.0.js"></script>
          <script src="..\jquery-3.6.0.js"></script>
          <script src="jquery-3.6.0.js"></script>
          <script>
               $(document).ready(function () {
                    $("#square").click(function () {
                         $("#square").animate({ top: 4, left: "+=100" }, 500);
                         $("#square").animate({ width: "+=50", height: "+=50" }, 500);
                    });
               });
          </script>
     </head>
     <body>
          <div id="square"></div>
     </body>
</html>
