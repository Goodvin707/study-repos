<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8" />
        <title>Форма для отправки данных</title>
    </head>
    <body>
        <form id="myForm">
            <label for="inputName">Имя:</label>
            <input type="text" id="inputName" name="name" required /><br /><br />

            <label for="inputSurname">Фамилия:</label>
            <input type="text" id="inputSurname" name="surname" required /><br /><br />

            <label for="inputGroup">Номер группы:</label>
            <input type="text" id="inputGroup" name="group" required /><br /><br />

            <label for="inputKypc">Kypc:</label>
            <input type="text" id="inputKypc" name="kypc" required /><br /><br />

            <input type="submit" value="Отправить данные" />
        </form>
        <script src="script.js"></script>
    </body>
</html>
