<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8" />
        <title>Форма для отправки данных в CSV формате</title>
    </head>
    <body>
        <form id="myForm">
            <label for="inputName">Имя:</label>
            <input type="text" id="inputName" name="name" required /><br /><br />

            <label for="inputSurname">Фамилия:</label>
            <input type="text" id="inputSurname" name="surname" required /><br /><br />

            <label for="inputGroup">Номер группы:</label>
            <input type="text" id="inputGroup" name="group" required /><br /><br />

            <label>Пол:</label>
            <input type="radio" id="male" name="gender" value="male" required />
            <label for="male">Мужской</label>
            <input type="radio" id="female" name="gender" value="female" required />
            <label for="female">Женский</label><br /><br />

            <label for="inputKypc">Kypc:</label>
            <input type="text" id="inputKypc" name="kypc" required /><br /><br />

            <button type="submit">Отправить данные</button>
            <script src="script.js"></script>
        </form>
    </body>
</html>
