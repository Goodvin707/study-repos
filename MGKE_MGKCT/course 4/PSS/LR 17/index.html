<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <link rel="stylesheet" href="stl.css">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>ToDo List</title>
</head>

<body>
    <div class="wrapper">
        <div class="header">
            <h1>ToDo List</h1>
            <input type="text" placeholder="New item" id="toDoEl" class="forDate">
            <input type="text" placeholder="Hour" id="forDateH" class="forDate">
            <input type="text" placeholder="Minutes" id="forDateM" class="forDate">
            <input type="text" placeholder="Seconds" id="forDateS" class="forDate">
            <div id="demo">
                <button class="btns" id="btnAdd" type="button">Add item</button>
                <button class="btns" id="btnFetch" type="button">Delete all</button>
            </div>
        </div>
        <ol id="list">
            <label id="lables"></label>
        </ol>
    </div>
    <script src="script.js"></script>
    <script src="all.js"></script>
</body>

</html>
