<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">

<head>
    <title>Dynamic tabs with</title>
    <link rel="stylesheet" href="style.css">
    <script type="text/javascript" src="jquery-1.4.min.js"></script>
    <script type="text/javascript">
        var a = 6;
        function addDoc() {
            var ul = document.getElementById("documents");
            var li = document.createElement("li");
            li.innerHTML = '<a href="#" rel="Document' + a + '" title="This is the content of Document' + a + '">Document' + a + '</a>';
            ul.appendChild(li);
            a++;
            $("#documents a").click(function () {
                addTab($(this));
            });
        }

        $(document).ready(function () {
            $("#documents a").click(function () {
                addTab($(this));
            });

            $('#tabs a.tab').live('click', function () {
                var contentname = $(this).attr("id") + "_content";
                $("#content p").hide();
                $("#tabs li").removeClass("current");
                $("#" + contentname).show();
                $(this).parent().addClass("current");
            });

            $('#tabs a.remove').live('click', function () {
                var tabid = $(this).parent().find(".tab").attr("id");
                var contentname = tabid + "_content";
                $("#" + contentname).remove();
                $(this).parent().remove();
                if ($("#tabs li.current").length == 0 && $("#tabs li").length > 0) {
                    var firsttab = $("#tabs li:first-child");
                    firsttab.addClass("current");
                    var firsttabid = $(firsttab).find("a.tab").attr("id");
                    $("#" + firsttabid + "_content").show();
                }
            });
        });


        function addTab(link) {
            if ($("#" + $(link).attr("rel")).length != 0)
                return;
            $("#tabs li").removeClass("current");
            $("#content p").hide();
            $("#tabs").append("<li class='current'><a class='tab' id='" +
                $(link).attr("rel") + "' href='#'>" + $(link).html() +
                "</a><a href='#' class='remove'>x</a></li>");

            $("#content").append("<p id='" + $(link).attr("rel") + "_content'>" +
                $(link).attr("title") + "</p>");
            $("#" + $(link).attr("rel") + "_content").show();
        }
    </script>
</head>

<body>
    <div id="header">
    </div>
    <div id="main">
        <div id="doclist">
            <h2>Documents</h2>
            <ul id="documents">
                <li><a href="#" rel="Document1" title="This is the content of Document1">Document1</a></li>
                <li><a href="#" rel="Document2" title="This is the content of Document2">Document2</a></li>
                <li><a href="#" rel="Document3" title="This is the content of Document3">Document3</a></li>
                <li><a href="#" rel="Document4" title="This is the content of Document4">Document4</a></li>
                <li><a href="#" rel="Document5" title="This is the content of Document5">Document5</a></li>
            </ul>
            <button id="addBtn" onclick="addDoc()">Добавить</button>
        </div>
        <div id="wrapper">
            <ul id="tabs"></ul>
            <div id="content"></div>
        </div>
    </div>
</body>

</html>
